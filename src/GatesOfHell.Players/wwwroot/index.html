<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0908" />
    <meta name="description" content="Gates of Hell — fichas, inventário e rolagens de RPG sobre Google Sheets." />
    <title>Gates of Hell — Fichas dos jogadores</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="_content/GatesOfHell.Shared/css/sheets.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/sheet.css" />
    <link rel="preload" id="webassembly" />

</head>

<body>
    <div id="app">
        <div class="boot-screen">
            <span class="boot-mark">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
                     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22c4 0 7-2.8 7-6.7 0-3-1.7-5.5-4.4-8.3-.4 2-1.4 3.1-2.6 3.9.2-3.8-1.8-6.6-3.4-8.4.2 4.2-3.6 6.2-3.6 11.5C5 18.5 8 22 12 22Z" />
                </svg>
            </span>
            <span class="boot-title">Gates of Hell</span>
            <span class="boot-sub">Abrindo os portões...</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        Algo quebrou no caminho.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">×</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
